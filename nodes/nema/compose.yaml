# nema — Orin Nano Super 8GB — llama.cpp only.
# Ports deviate from the fleet table (8080/8081) because 8080 on this host is taken by the
# NemoClaw/OpenShell k3s container. 908x is the convention OpenFang already consumes.
#   core : 9080 Qwen3-4B-Instruct-2507 (text router)  + 9082 nomic-embed (embeddings)
#   vlm  : 9081 Qwen3-VL-2B (snapshot VLM) — swap-in: mutually exclusive with the 9080 router on 8 GB
name: inference

x-llama: &llama
  image: ${LLAMA_IMAGE}
  runtime: nvidia
  network_mode: host
  ipc: host
  restart: unless-stopped
  volumes:
    - ${MODELS_DIR}:/models:ro
  logging: { driver: json-file, options: { max-size: "20m", max-file: "3" } }

services:
  qwen3-4b:
    <<: *llama
    container_name: llm-qwen3-4b
    profiles: [core]
    command:
      - llama-server
      - --model
      - /models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
      - --alias
      - qwen3-4b-instruct-2507
      - --host
      - 0.0.0.0
      - --port
      - "9080"
      - --ctx-size
      - "8192"
      - --n-gpu-layers
      - "999"
      - --jinja
      - --parallel
      - "2"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9080/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  embeddings:
    <<: *llama
    container_name: llm-embeddings
    profiles: [core]
    command:
      - llama-server
      - --model
      - /models/nomic-embed-text-v1.5.Q8_0.gguf
      - --alias
      - nomic-embed-text-v1.5
      - --embedding
      - --pooling
      - mean
      - --host
      - 0.0.0.0
      - --port
      - "9082"
      - --ctx-size
      - "8192"
      - --n-gpu-layers
      - "999"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9082/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  qwen3-vl-2b:
    <<: *llama
    container_name: vlm-qwen3-vl-2b
    profiles: [vlm]
    command:
      - llama-server
      - --model
      - /models/Qwen3VL-2B-Instruct-Q4_K_M.gguf
      - --mmproj
      - /models/mmproj-Qwen3VL-2B-Instruct-F16.gguf
      - --alias
      - qwen3-vl-2b-instruct
      - --host
      - 0.0.0.0
      - --port
      - "9081"
      # The vision encoder (mmproj) needs ~800 MiB that is NOT free while the core profile is
      # resident on this 8 GB board: run `docker compose stop qwen3-4b` first (swap-in), or retire
      # the NemoClaw k3s container to make room. Validated: 'red' @ 24 tok/s with the router stopped.
      - --ctx-size
      - "4096"
      - --parallel
      - "1"
      - --flash-attn
      - "on"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --n-gpu-layers
      - "999"
      - --jinja
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9081/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
