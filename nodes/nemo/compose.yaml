# nemo — Orin NX 16GB.
#   core     : 8080 Qwen3-8B Q4_K_M (daily driver, resident)
#   quality  : 8081 Qwen3-14B Q4_K_M (swap-in; keep ctx small)
#   vlm      : 8000 Qwen3-VL-4B — llama.cpp GGUF (default VLM path on this host)
#   vlm-vllm : 8000 Qwen3-VL-4B AWQ via the Jetson AI Lab vLLM 0.19 image (alternative; ~20 GB image)
# MEMORY: this host also runs system Ollama on :11434 for Home Assistant (172.16.3.3).
# HA's model must be qwen3:4b (3.6 GB loaded) — gemma4:e4b (10.6 GB) does not fit beside core.
# Measured 2026-09-10: core + qwen3:4b = 11.7 GB used, 3.5 GB free. See docs/runbook.md §6.
name: inference

x-llama: &llama
  image: ${LLAMA_IMAGE}
  runtime: nvidia
  network_mode: host
  ipc: host
  restart: unless-stopped
  volumes:
    - ${MODELS_DIR}:/models:ro
  logging: { driver: json-file, options: { max-size: "20m", max-file: "3" } }

services:
  qwen3-8b:
    <<: *llama
    container_name: llm-qwen3-8b
    profiles: [core]
    command:
      - llama-server
      - --model
      - /models/Qwen3-8B-Q4_K_M.gguf
      - --alias
      - qwen3-8b
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "16384"
      - --n-gpu-layers
      - "999"
      - --jinja
      - --parallel
      - "2"
      - --reasoning-format
      - deepseek
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s

  qwen3-14b:
    <<: *llama
    container_name: llm-qwen3-14b
    profiles: [quality]
    command:
      - llama-server
      - --model
      - /models/Qwen3-14B-Q4_K_M.gguf
      - --alias
      - qwen3-14b
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - --ctx-size
      - "8192"
      - --n-gpu-layers
      - "999"
      - --jinja
      - --reasoning-format
      - deepseek
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 240s

  qwen3-vl-4b:
    <<: *llama
    container_name: vlm-qwen3-vl-4b
    profiles: [vlm]
    command:
      - llama-server
      - --model
      - /models/Qwen3VL-4B-Instruct-Q4_K_M.gguf
      - --mmproj
      - /models/mmproj-Qwen3VL-4B-Instruct-F16.gguf
      - --alias
      - qwen3-vl-4b-instruct
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --ctx-size
      - "8192"
      - --n-gpu-layers
      - "999"
      - --jinja
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s

  # Alternative VLM path from the fleet table (vLLM + AWQ W4A16). Same port; do not run
  # both vlm profiles at once. Jetson AI Lab image is vLLM 0.19 (fine for Qwen3-VL).
  qwen3-vl-4b-awq:
    image: ${VLLM_JETSON_IMAGE}
    container_name: vlm-qwen3-vl-4b-awq
    profiles: [vlm-vllm]
    runtime: nvidia
    network_mode: host
    ipc: host
    shm_size: "8g"
    restart: unless-stopped
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      CUDA_HOME: /usr/local/cuda
      TRITON_PTXAS_PATH: /usr/local/cuda/bin/ptxas
    volumes:
      - ${HF_HOME}:/root/.cache/huggingface
      - /home/amigx/.cache/vllm:/root/.cache/vllm
    entrypoint: ["vllm", "serve"]
    command:
      - cpatonn/Qwen3-VL-4B-Instruct-AWQ-4bit
      - --served-model-name
      - qwen3-vl-4b-instruct
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - half
      - --gpu-memory-utilization
      - "0.35"
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "2"
      - --limit-mm-per-prompt
      - '{"image":2,"video":0}'
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s
    logging: { driver: json-file, options: { max-size: "20m", max-file: "3" } }
